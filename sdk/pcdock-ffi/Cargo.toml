[package]
name = "pcdock-ffi"
version.workspace = true
edition.workspace = true
description = "C ABI поверх pcdock-core: сессия, ввод и события для Python/игр."
license.workspace = true
repository.workspace = true
publish = false
[lib]
name = "pcdock_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
pcdock-core = { path = "../pcdock-core" }
pcdock-farm = { path = "../pcdock-farm", features = ["json"] }
serde_json = "1"
