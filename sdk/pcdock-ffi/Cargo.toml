[package]
name = "pcdock-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI поверх pcdock-core: сессия, ввод и события для Python/игр."
license = "MIT OR Apache-2.0"

[lib]
name = "pcdock_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
pcdock-core = { path = "../pcdock-core" }
pcdock-farm = { path = "../pcdock-farm", features = ["json"] }
serde_json = "1"
