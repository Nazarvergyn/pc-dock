[package]
name = "pcdock-usb"
version.workspace = true
edition.workspace = true
description = "USB-адаптер PC Dock: выполняет запросы ядра через libusb."
license.workspace = true
repository.workspace = true
publish = false
[dependencies]
pcdock-core = { path = "../pcdock-core" }
rusb = "0.9"

# Windows: libusb собирается из исходников (системной библиотеки там нет).
[target.'cfg(windows)'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }
