[package]
name = "pcdock-daemon"
version = "0.1.0"
edition = "2021"
description = "Daemon library: owns phones, threads and reconnects. Thin binary and sockets on top."
license = "MIT OR Apache-2.0"

[lib]
name = "pcdock_daemon"
path = "src/lib.rs"

[dependencies]
pcdock-core = { path = "../pcdock-core" }
pcdock-usb = { path = "../pcdock-usb" }
