[package]
name = "pcdock-client"
version.workspace = true
edition.workspace = true
description = "Rust client for the PC Dock daemon protocol (TCP and local pipe)."
license.workspace = true
repository.workspace = true
publish = false
[dependencies]
pcdock-net = { path = "../pcdock-net" }
serde_json = "1"
interprocess = "2"

[dev-dependencies]
pcdock-serve = { path = "../pcdock-serve" }
pcdock-farm = { path = "../pcdock-farm", default-features = false }
pcdock-core = { path = "../pcdock-core" }
