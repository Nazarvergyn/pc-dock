[package]
name = "pcdock-autod"
version = "0.1.0"
edition = "2021"
description = "PC Dock automation daemon: Lua scenarios as tests with assertions, logs and a live event stream."
license = "MIT OR Apache-2.0"

[lib]
name = "pcdock_autod"
path = "src/lib.rs"

[[bin]]
name = "pcdock-autod"
path = "src/main.rs"

[dependencies]
pcdock-net = { path = "../pcdock-net" }
pcdock-client = { path = "../pcdock-client" }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
pcdock-serve = { path = "../pcdock-serve" }
pcdock-farm = { path = "../pcdock-farm", default-features = false }
pcdock-core = { path = "../pcdock-core" }
