[package]
name = "pcdockd"
version.workspace = true
edition.workspace = true
description = "PC Dock daemon: owns phones on any transport, serves one app protocol."
license.workspace = true
repository.workspace = true
publish = false
[[bin]]
name = "pcdockd"
path = "src/main.rs"

[dependencies]
pcdock-core = { path = "../pcdock-core" }
pcdock-farm = { path = "../pcdock-farm" }
pcdock-serve = { path = "../pcdock-serve" }
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
