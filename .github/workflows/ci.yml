name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk
      - name: libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - name: libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devices/android/app-screencast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build and test
        run: ./gradlew :lib-protocol:test :app:assembleDebug :server-adb:assembleDebug
